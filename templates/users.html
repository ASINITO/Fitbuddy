{% extends "base.html" %}

{% block title %}User Management - FitBuddy Admin{% endblock %}

{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    <div class="flex items-center justify-between pb-4 border-b border-slate-800">
        <div>
            <h1 class="text-2xl font-black text-white">Registered Users</h1>
            <p class="text-xs text-slate-400 mt-1">Search, inspect profiles, and monitor activity across the platform</p>
        </div>
        <a href="/admin" class="px-4 py-2 bg-slate-900 border border-slate-700 text-slate-200 text-xs font-semibold rounded-xl hover:bg-slate-800 transition">
            Admin Overview
        </a>
    </div>

    <!-- Search & Filter Controls -->
    <div class="p-4 bg-slate-900 border border-slate-800 rounded-2xl flex flex-col sm:flex-row gap-4">
        <input type="text" id="searchInput" placeholder="Search by name, username, or email..." oninput="filterUsers()"
               class="flex-1 px-4 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white focus:outline-none focus:border-emerald-500">
        <select id="goalFilter" onchange="filterUsers()" class="px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white">
            <option value="All">All Goals</option>
            <option value="Weight management">Weight management</option>
            <option value="Muscle building">Muscle building</option>
            <option value="Strength">Strength</option>
            <option value="Endurance">Endurance</option>
            <option value="General wellness">General wellness</option>
        </select>
        <select id="levelFilter" onchange="filterUsers()" class="px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white">
            <option value="All">All Levels</option>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
        </select>
    </div>

    <!-- User Table -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-sm">
        <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
                <thead class="bg-slate-950 border-b border-slate-800 text-slate-400 font-semibold uppercase tracking-wider">
                    <tr>
                        <th class="px-6 py-3.5">User</th>
                        <th class="px-6 py-3.5">Goal</th>
                        <th class="px-6 py-3.5">Level</th>
                        <th class="px-6 py-3.5">Joined</th>
                        <th class="px-6 py-3.5">Last Active</th>
                        <th class="px-6 py-3.5">Role</th>
                    </tr>
                </thead>
                <tbody id="userTableBody" class="divide-y divide-slate-800/60 text-slate-300">
                    <tr><td colspan="6" class="px-6 py-8 text-center text-slate-500">Loading user directory...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
let allUsers = [];

document.addEventListener("DOMContentLoaded", async () => {
    try {
        const res = await fetch('/api/admin/users');
        if (res.ok) {
            allUsers = await res.json();
            renderTable(allUsers);
        }
    } catch (e) { console.error(e); }
});

function renderTable(users) {
    const tbody = document.getElementById('userTableBody');
    if (users.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-8 text-center text-slate-500">No users match query.</td></tr>`;
        return;
    }
    tbody.innerHTML = users.map(u => `
        <tr class="hover:bg-slate-800/40 transition">
            <td class="px-6 py-4">
                <div class="font-bold text-white">${u.full_name}</div>
                <div class="text-[11px] text-slate-400">@${u.username} • ${u.email}</div>
            </td>
            <td class="px-6 py-4">${u.fitness_goal}</td>
            <td class="px-6 py-4">
                <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-slate-800 border border-slate-700 text-slate-300">
                    ${u.fitness_level}
                </span>
            </td>
            <td class="px-6 py-4 text-slate-400 font-mono text-[11px]">${u.created_at}</td>
            <td class="px-6 py-4 text-slate-400 font-mono text-[11px]">${u.last_active}</td>
            <td class="px-6 py-4">
                ${u.is_admin ? '<span class="text-amber-400 font-bold text-[10px] px-2 py-0.5 rounded bg-amber-500/10 border border-amber-500/20">Admin</span>' : '<span class="text-slate-400 text-[10px]">Member</span>'}
            </td>
        </tr>
    `).join('');
}

function filterUsers() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const g = document.getElementById('goalFilter').value;
    const l = document.getElementById('levelFilter').value;

    const filtered = allUsers.filter(u => {
        const matchQ = !q || u.full_name.toLowerCase().includes(q) || u.username.toLowerCase().includes(q) || u.email.toLowerCase().includes(q);
        const matchG = g === "All" || u.fitness_goal === g;
        const matchL = l === "All" || u.fitness_level === l;
        return matchQ && matchG && matchL;
    });
    renderTable(filtered);
}
</script>
{% endblock %}
