{% extends "base.html" %}

{% block title %}Error - FitBuddy{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-20 text-center">
    <div class="w-16 h-16 rounded-2xl bg-red-500/10 text-red-400 flex items-center justify-center mx-auto mb-4">
        <i data-lucide="alert-octagon" class="w-8 h-8"></i>
    </div>
    <h1 class="text-2xl font-bold text-white mb-2">Something went wrong</h1>
    <p class="text-xs text-slate-400 mb-6">{{ detail or "An unexpected issue occurred while processing your fitness request." }}</p>
    <a href="/dashboard" class="px-5 py-2.5 bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs hover:bg-emerald-600 transition shadow-md">
        Return to Dashboard
    </a>
</div>
{% endblock %}
