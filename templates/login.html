{% extends "base.html" %}

{% block title %}Sign In - FitBuddy{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-white">Welcome Back</h1>
            <p class="text-xs text-slate-400 mt-1">Sign in to resume your AI fitness routine</p>
        </div>

        <div id="errorAlert" class="hidden mb-4 p-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-xs"></div>

        <form id="loginForm" onsubmit="submitLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Username or Email</label>
                <input type="text" id="username_or_email" required
                       class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500 transition"
                       placeholder="e.g. johndoe">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-300 mb-1">Password</label>
                <input type="password" id="password" required
                       class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500 transition"
                       placeholder="••••••••">
            </div>

            <button type="submit" id="submitBtn"
                    class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold rounded-lg text-sm shadow-md shadow-emerald-500/20 transition">
                Sign In
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-800 text-center text-xs text-slate-400">
            Don't have an account? <a href="/register" class="text-emerald-400 hover:underline font-semibold">Register here</a>
        </div>

        <div class="mt-4 p-3 bg-slate-950/60 rounded-lg border border-slate-800/80 text-xs text-slate-400 space-y-1">
            <div class="font-medium text-slate-300">Quick Test Accounts:</div>
            <div>• User: <span class="text-emerald-400">johndoe</span> / <span class="text-emerald-400">password123</span></div>
            <div>• Admin: <span class="text-cyan-400">admin</span> / <span class="text-cyan-400">AdminPassword123!</span></div>
        </div>
    </div>
</div>

<script>
async function submitLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('errorAlert');
    btn.disabled = true;
    btn.innerText = "Signing in...";
    alertBox.classList.add('hidden');

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username_or_email: document.getElementById('username_or_email').value,
                password: document.getElementById('password').value
            })
        });
        const data = await res.json();
        if (!res.ok) {
            alertBox.innerText = data.detail || "Invalid login credentials.";
            alertBox.classList.remove('hidden');
            btn.disabled = false;
            btn.innerText = "Sign In";
        } else {
            window.location.href = data.user.is_admin ? '/admin' : '/dashboard';
        }
    } catch (err) {
        alertBox.innerText = "Network error. Please try again.";
        alertBox.classList.remove('hidden');
        btn.disabled = false;
        btn.innerText = "Sign In";
    }
}
</script>
{% endblock %}
